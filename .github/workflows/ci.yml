name: CI & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv venv .venv
          VIRTUAL_ENV=.venv uv pip install -e ".[obs,dev]"

      - name: Run Ruff Lint Check
        run: |
          .venv/bin/ruff check .

      - name: Run Offline Test Suites
        run: |
          .venv/bin/python test_modes.py
          .venv/bin/python test_syndicate.py
          .venv/bin/python test_ui.py
